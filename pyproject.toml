[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clausius"
version = "0.1.1"
description = "Detect whether a deployment change degraded your model — without a labeled eval set"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["llm", "quantization", "regression-testing", "mixture-of-experts", "mlx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
# mlx-lm is needed only to CAPTURE. Comparison and analysis are pure numpy, so
# CI and anyone re-analyzing the published corpus need no accelerator at all.
mlx = ["mlx-lm>=0.20"]
# EXPERIMENTAL. The same measurement on torch, for hardware mlx does not
# run on. Validated on CPU and MPS (FINDINGS F15); untested on CUDA, on
# multi-GPU sharding, and against CUDA quantizers.
torch = ["torch>=2.2", "transformers>=4.40", "accelerate>=0.26"]
dev = ["pytest>=7"]

[project.scripts]
clausius = "clausius.cli:main"

[project.urls]
Homepage = "https://github.com/beatakouchnir/clausius"
Findings = "https://github.com/beatakouchnir/clausius/blob/main/FINDINGS.md"
Issues = "https://github.com/beatakouchnir/clausius/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clausius"]

# The sdist carries what is needed to build and test the package. The research
# package, the chain scripts and the 11 MB measurement corpus are provenance,
# they live on GitHub, and shipping them here would make `pip download` pull
# megabytes of records that the installed package never reads.
[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
exclude = ["knowledge/", "experiments/", "records/", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
