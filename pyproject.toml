[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clausius"
version = "0.1.0"
description = "Detect whether a deployment change degraded your model — without a labelled eval set"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["llm", "quantization", "regression-testing", "mixture-of-experts", "mlx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
# mlx-lm is needed only to CAPTURE. Comparison and analysis are pure numpy, so
# CI and anyone re-analysing the published corpus need no accelerator at all.
mlx = ["mlx-lm>=0.20"]
dev = ["pytest>=7"]

[project.scripts]
clausius = "clausius.cli:main"

[project.urls]
Homepage = "https://github.com/wintergreen22/clausius"
Findings = "https://github.com/wintergreen22/clausius/blob/main/FINDINGS.md"
Issues = "https://github.com/wintergreen22/clausius/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clausius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
