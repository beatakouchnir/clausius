[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clausius"
version = "0.1.3"
description = "Detect whether a deployment change degraded your model — without a labeled eval set"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["llm", "quantization", "regression-testing", "mixture-of-experts", "mlx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
# mlx-lm is needed only to CAPTURE. Comparison and analysis are pure numpy, so
# CI and anyone re-analyzing existing captures need no accelerator at all.
mlx = ["mlx-lm>=0.20"]
dev = ["pytest>=7"]

[project.scripts]
clausius = "clausius.cli:main"

[project.urls]
Homepage = "https://github.com/beatakouchnir/clausius"
Issues = "https://github.com/beatakouchnir/clausius/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clausius"]

# The sdist carries what is needed to build and test the package. The research
# package, the chain scripts and the measurement corpus are provenance and live
# in a separate research repository; the sdist ships the tool and its tests,
# nothing else.
[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
exclude = [".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
